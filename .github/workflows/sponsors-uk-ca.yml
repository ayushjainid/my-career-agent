name: UK, Canada and Ireland sponsor data

# UK: Home Office register of licensed sponsors (updated daily). Copy the CSV link from
#   https://www.gov.uk/government/publications/register-of-licensed-sponsors-workers
# Canada: ESDC positive LMIA employers list (quarterly). Copy the CSV link from
#   https://open.canada.ca (search "positive labour market impact assessment employers")
# Ireland: DETE "Permits issued to companies" for this year and last year (updated monthly), fetched
#   from enterprise.gov.ie by default; set IE_PERMITS_URL to override this year's file.
# Or set repository variables UK_REGISTER_URL / CA_LMIA_URL for the weekly run.

on:
  workflow_dispatch:
    inputs:
      uk_url: { description: "UK register CSV URL", required: false }
      ca_url: { description: "Canada positive LMIA CSV URL", required: false }
      ie_url: { description: "Ireland permits-issued-to-companies XLSX URL (default: this year's file)", required: false }
  schedule:
    - cron: "41 5 * * 1"

jobs:
  load:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobs
    env:
      UK_URL: ${{ inputs.uk_url || vars.UK_REGISTER_URL }}
      CA_URL: ${{ inputs.ca_url || vars.CA_LMIA_URL }}
      IE_URL: ${{ inputs.ie_url || vars.IE_PERMITS_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Derive the loader connection string
        run: node ../scripts/db-urls.mjs
        env:
          DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[db]"
      - name: Download and load
        run: |
          set -euo pipefail
          mkdir -p data
          args=()
          # Without a URL given, find the current files from GOV.UK and open.canada.ca.
          eval "$(python -m my_career_agent_jobs.sponsor_urls)"
          UK_URL="${UK_URL:-$UK_FOUND}"
          CA_URLS="${CA_URL:-$CA_FOUND}"
          echo "UK: ${UK_URL:-none}"; echo "CA: ${CA_URLS:-none}"
          if [ -n "${UK_URL}" ]; then curl -fL --retry 3 -o data/uk_register.csv "${UK_URL}"; args+=(--uk data/uk_register.csv); fi
          i=0
          for u in ${CA_URLS}; do
            i=$((i + 1)); ext="${u##*.}"; ext="${ext%%\?*}"; [ "$ext" = "xlsx" ] || ext=csv
            if curl -fL --retry 3 -o "data/ca_lmia_${i}.${ext}" "$u"; then args+=(--ca "data/ca_lmia_${i}.${ext}"); else echo "::warning::Canada file not downloaded: $u"; fi
          done
          # Ireland: this year's and last year's DETE files (the file name carries the year).
          y=$(date -u +%Y)
          for yr in "$y" "$((y - 1))"; do
            url="https://enterprise.gov.ie/en/publications/publication-files/permits-issued-to-companies-${yr}.xlsx"
            if [ "$yr" = "$y" ] && [ -n "${IE_URL}" ]; then url="${IE_URL}"; fi
            if curl -fsL --retry 3 -o "data/permits-issued-to-companies-${yr}.xlsx" "$url"; then args+=(--ie "data/permits-issued-to-companies-${yr}.xlsx"); else echo "::warning::Ireland permits file for ${yr} not found at ${url}"; fi
          done
          if [ ${#args[@]} -eq 0 ]; then echo "No URLs configured; nothing to do."; exit 0; fi
          python -m my_career_agent_jobs.uk_ca_sponsors "${args[@]}"
