name: Seed companies (POC loop P1)

# Loads jobs/companies.csv (your target companies and their job boards) into the shared catalog.
# Safe to re-run: companies are upserted by ATS board. Edit the CSV, push, then run this.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [jobs/companies.csv, jobs/companies_open_lists.csv]

jobs:
  seed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Derive the loader connection string
        run: node ../scripts/db-urls.mjs
        env:
          DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[db]"
      - run: |
          if [ ! -f companies.csv ]; then echo "Add jobs/companies.csv (see companies.example.csv)"; exit 1; fi
          # Open lists first, so the curated file's names and aliases win for the same board.
          python -m my_career_agent_jobs.seed_companies companies_open_lists.csv companies.csv
        env:
          DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
