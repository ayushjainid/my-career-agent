<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>My Career Agent</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #fff; --ink: #1d1d1b; --quiet: #63625d; --line: #e3e2dc;
    --accent: #2f5bd3; --accent-ink: #fff; --good: #1f7a4a; --warn: #9a6400; --bad: #b3261e;
    --good-bg: #e6f4ec; --warn-bg: #fdf3dd; --bad-bg: #fbe9e7; --radius: 10px;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --card: #1e1e1c; --ink: #ecebe6; --quiet: #a3a29b; --line: #34332f; --accent: #7c9cff; --accent-ink: #0b0b0a;
      --good: #6fd19a; --warn: #f0c060; --bad: #ff8a80; --good-bg: #17301f; --warn-bg: #33290f; --bad-bg: #3a1a18; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  header { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1000px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .brand { font-weight: 700; margin-right: 12px; }
  nav { display: flex; gap: 2px; overflow-x: auto; white-space: nowrap; max-width: 100%; scrollbar-width: none; }
  nav a { color: var(--quiet); text-decoration: none; padding: 6px 10px; border-radius: 8px; }
  nav a.on { color: var(--ink); background: var(--bg); font-weight: 600; }
  main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 17px; margin: 24px 0 8px; } h3 { font-size: 15px; margin: 0; }
  .sub { color: var(--quiet); margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin: 10px 0; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1 1 auto; min-width: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  label { display: block; font-size: 13px; color: var(--quiet); margin-bottom: 4px; }
  input, select, textarea { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  textarea { min-height: 90px; resize: vertical; }
  input[type=checkbox] { width: auto; }
  button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 7px 12px; cursor: pointer; text-decoration: none; display: inline-block; }
  button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  .pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--quiet); }
  .pill.good { background: var(--good-bg); color: var(--good); border-color: transparent; }
  .pill.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
  .pill.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
  .score { font-size: 20px; font-weight: 700; min-width: 48px; text-align: center; }
  .note { font-size: 13px; color: var(--quiet); }
  .msg { padding: 10px 12px; border-radius: 8px; margin: 10px 0; }
  .msg.bad { background: var(--bad-bg); color: var(--bad); } .msg.good { background: var(--good-bg); color: var(--good); } .msg.warn { background: var(--warn-bg); color: var(--warn); }
  ul.plain { list-style: none; padding: 0; margin: 6px 0; } ul.plain li { padding: 3px 0; }
  table { width: 100%; border-collapse: collapse; } th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; } th { font-size: 13px; color: var(--quiet); font-weight: 600; }
  pre.draft { white-space: pre-wrap; font: inherit; background: var(--bg); border-radius: 8px; padding: 10px; margin: 8px 0; }
  .field { display: grid; grid-template-columns: 220px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .field .val { word-break: break-word; }
  @media (max-width: 640px) { .field { grid-template-columns: 1fr auto; } .field .lbl { grid-column: 1 / -1; } }
  details summary { cursor: pointer; color: var(--quiet); }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header><div class="bar">
  <span class="brand">My Career Agent</span>
  <nav id="nav"></nav>
</div></header>
<main id="main" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";
// No framework and no build step. Every value from the server is written with textContent,
// never as HTML, so a job posting or a contact name cannot inject script.

// ---------- small helpers ----------
const $main = document.getElementById("main");
// Let views pass optional parts (null / false) to replaceChildren without them showing as text.
const nativeReplace = Element.prototype.replaceChildren;
Element.prototype.replaceChildren = function (...kids) {
  return nativeReplace.apply(this, kids.flat().filter((k) => k !== null && k !== undefined && k !== false));
};
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "class") n.className = v;
    else if (k === "value") n.value = v;
    else n.setAttribute(k, v === true ? "" : String(v));
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) n.append(kid instanceof Node ? kid : String(kid));
  return n;
}
const render = (...nodes) => { $main.replaceChildren(...nodes); };
function toast(text) { const t = document.getElementById("toast"); t.textContent = text; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1800); }
const msg = (kind, text) => el("div", { class: `msg ${kind}` }, text);
const today = () => new Date().toISOString().slice(0, 10);
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch { const t = el("textarea", { value: text }); document.body.append(t); t.select(); document.execCommand("copy"); t.remove(); toast("Copied"); }
}

// Token: kept in this browser only. localStorage can be unavailable (private mode); fall back to memory.
const store = { mem: null,
  get() { try { return localStorage.getItem("mca_token") ?? this.mem; } catch { return this.mem; } },
  set(v) { this.mem = v; try { v ? localStorage.setItem("mca_token", v) : localStorage.removeItem("mca_token"); } catch {} } };

class ApiError extends Error { constructor(status, message) { super(message); this.status = status; } }
async function api(method, path, body) {
  const res = await fetch(`/api${path}`, {
    method, headers: { authorization: `Bearer ${store.get()}`, ...(body !== undefined ? { "content-type": "application/json" } : {}) },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch {}
  if (res.status === 401) { store.set(null); location.hash = "#/signin"; throw new ApiError(401, "Please sign in again."); }
  if (!res.ok) throw new ApiError(res.status, (data && data.error) || `Request failed (${res.status})`);
  return data;
}
/** Runs an action, shows its error inline instead of failing silently. */
async function guard(where, fn) {
  try { return await fn(); } catch (e) { if (e.status !== 401) where.replaceChildren(msg("bad", e.message)); }
}

// Mirrors apps/api/src/lib/transitions.ts (the server enforces it; this only offers valid moves).
const NEXT = { queued: ["approved", "skipped"], approved: ["ready_for_review", "submitted", "failed", "skipped"],
  ready_for_review: ["submitted", "failed", "approved", "skipped"], failed: ["approved", "skipped"],
  submitted: ["screen", "interview", "rejected", "withdrawn", "offer"], screen: ["interview", "rejected", "withdrawn", "offer"],
  interview: ["interview", "offer", "rejected", "withdrawn"], offer: ["withdrawn"], rejected: [], withdrawn: [], skipped: ["queued"] };
const ACTION_LABEL = { approved: "Approve", submitted: "I submitted it", failed: "Couldn't apply", skipped: "Skip", ready_for_review: "Filled, needs review" };
const STATE_LABEL = { queued: "Queued", approved: "Approved", ready_for_review: "Ready for review", submitted: "Submitted", screen: "Screen",
  interview: "Interview", offer: "Offer", rejected: "Rejected", withdrawn: "Withdrawn", failed: "Failed", skipped: "Skipped" };
async function moveTo(appId, state, note) { await api("POST", `/applications/${appId}/status`, { state, note }); toast(STATE_LABEL[state]); }

// ---------- router ----------
const ROUTES = [["today", "Today"], ["tracker", "Tracker"], ["profile", "Profile"], ["answers", "Answers"], ["connections", "Connections"], ["score", "Score a job"]];
function nav(active) {
  const n = document.getElementById("nav");
  if (!store.get()) { n.replaceChildren(); return; }
  n.replaceChildren(...ROUTES.map(([r, label]) => el("a", { href: `#/${r}`, class: r === active ? "on" : "" }, label)),
    el("a", { href: "#/signin", onclick: () => store.set(null) }, "Sign out"));
}
async function route() {
  const [, name = "", arg] = location.hash.split("/");
  const page = store.get() ? name || "today" : "signin";
  nav(page);
  const views = { signin, today: todayView, tracker, profile: profileView, answers, connections, score, packet };
  render(el("p", { class: "note" }, "Loading…"));
  await (views[page] || todayView)(arg ? decodeURIComponent(arg) : undefined);
}
window.addEventListener("hashchange", route);

// ---------- sign in ----------
function signin() {
  const input = el("input", { type: "password", autocomplete: "current-password", placeholder: "Your MCA_TOKEN" });
  const out = el("div");
  const go = async (e) => {
    e.preventDefault();
    store.set(input.value.trim());
    try { await api("GET", "/health"); await fetch("/api/profile", { headers: { authorization: `Bearer ${store.get()}` } }).then((r) => { if (r.status === 401) throw new ApiError(401, "That token was not accepted."); });
      location.hash = "#/today"; }
    catch (err) { store.set(null); out.replaceChildren(msg("bad", err.message)); }
  };
  render(el("h1", {}, "Sign in"), el("p", { class: "sub" }, "Paste the API token you saved as MCA_TOKEN. It stays in this browser."),
    el("form", { class: "card", onsubmit: go }, el("label", {}, "API token"), input, el("div", { class: "row", style: "margin-top:10px" }, el("button", { class: "primary" }, "Sign in")), out));
  input.focus();
}

// ---------- today ----------
async function todayView() {
  const out = el("div");
  const list = el("div");
  const excluded = el("div");
  const build = el("button", { class: "primary", onclick: async () => {
    build.disabled = true;
    await guard(out, async () => { const r = await api("POST", "/queue/build"); out.replaceChildren(msg("good", `Queued ${r.queued}, excluded ${r.excluded}, held back ${r.heldBack}.${r.note ? " " + r.note : ""}`)); await load(); });
    build.disabled = false;
  } }, "Build today's queue");

  async function load() {
    const q = await api("GET", "/queue");
    if (!q.items.length) list.replaceChildren(el("div", { class: "card" }, el("p", {}, "Nothing queued."), el("p", { class: "note" },
      "The queue is built every day at 06:05 UTC from your targets, facts and the job catalog. Build it now, or add companies and a target first.")));
    else list.replaceChildren(...q.items.map(queueCard));
    const run = await api("GET", `/queue/runs/${today()}`).catch(() => null);
    excluded.replaceChildren(run && run.excluded.length ? el("details", { class: "card" }, el("summary", {}, `Excluded today: ${run.excluded.length} (why)`),
      el("ul", { class: "plain" }, run.excluded.map((x) => el("li", { class: "note" }, x.reason)))) : "");
  }
  render(el("div", { class: "row" }, el("div", { class: "grow" }, el("h1", {}, "Today"), el("p", { class: "sub" }, "Approve what you'll apply to, ask for referrals first, then open the packet.")), build), out, list, excluded);
  await guard(out, load);
}

function verdictPill(item) {
  const pills = [];
  if (item.gate_verdict === "FLAG") pills.push(el("span", { class: "pill warn" }, "Check gates"));
  if (item.integrity === "alarm") pills.push(el("span", { class: "pill bad" }, "Posting has hidden text"));
  if (item.referral_name) pills.push(el("span", { class: "pill good" }, `Referral: ${item.referral_name}`));
  else if (item.contacts) pills.push(el("span", { class: "pill good" }, `${item.contacts} contact${item.contacts === 1 ? "" : "s"}`));
  return pills;
}
function pay(item) {
  if (!item.pay_max && !item.pay_min) return null;
  const f = (n) => Number(n).toLocaleString();
  return `${item.pay_currency || ""} ${item.pay_min ? f(item.pay_min) + "–" : ""}${item.pay_max ? f(item.pay_max) : ""}`.trim();
}
function queueCard(item) {
  const extra = el("div");
  const card = el("div", { class: "card" },
    el("div", { class: "row" },
      el("div", { class: "score", title: "Fit score out of 100" }, item.fit_score ?? "–"),
      el("div", { class: "grow" }, el("h3", {}, `${item.company}: ${item.title}`),
        el("div", { class: "note" }, [item.location_text, item.remote_type, pay(item), STATE_LABEL[item.state]].filter(Boolean).join(" · ")),
        el("div", { class: "row", style: "margin-top:4px" }, verdictPill(item))),
      el("div", { class: "row" },
        item.contacts ? el("button", { onclick: () => showReferrals(item, extra) }, "Referrals") : null,
        el("a", { class: "btn", href: `#/packet/${item.job_id}` }, "Packet"),
        item.state === "queued" ? el("button", { class: "primary", onclick: async () => { await guard(extra, () => moveTo(item.id, "approved")); route(); } }, "Approve") : null,
        el("button", { onclick: async () => { await guard(extra, () => moveTo(item.id, "skipped")); route(); } }, "Skip"))),
    item.notes ? el("p", { class: "note" }, item.notes) : null,
    extra);
  return card;
}
async function showReferrals(item, box) {
  await guard(box, async () => {
    const r = await api("GET", `/referrals/${item.job_id}`);
    box.replaceChildren(...r.items.map((p) => el("div", { class: "card" },
      el("div", { class: "row" }, el("div", { class: "grow" }, el("strong", {}, p.full_name), " ", el("span", { class: "note" }, [p.position, `strength ${Math.round(p.strength * 100)}`, p.messages_count ? `${p.messages_count} messages` : null, p.last_ask_at ? `asked ${p.last_ask_at}` : null].filter(Boolean).join(" · "))),
        p.profile_url ? el("a", { class: "btn", href: p.profile_url, target: "_blank", rel: "noopener noreferrer" }, "Open LinkedIn") : null,
        el("button", { onclick: () => copy(p.draft) }, "Copy message"),
        el("button", { class: "primary", onclick: async () => { await guard(box, async () => { await api("POST", `/applications/${item.id}/referral`, { contactId: p.id }); toast("Ask recorded"); route(); }); } }, "I asked")),
      el("pre", { class: "draft" }, p.draft))));
  });
}

// ---------- packet / copy-assist ----------
async function packet(jobId) {
  const out = el("div");
  render(out);
  await guard(out, async () => {
    const [p, facts] = await Promise.all([api("GET", `/packets/${jobId}`), api("GET", "/facts")]);
    const a = p.application;
    const head = el("div", { class: "row" },
      el("div", { class: "grow" }, el("h1", {}, `${p.job.company}: ${p.job.title}`), el("p", { class: "sub" }, [p.job.location_text, p.job.ats_vendor, a && STATE_LABEL[a.state]].filter(Boolean).join(" · "))),
      p.job.apply_url ? el("a", { class: "btn primary", href: p.job.apply_url, target: "_blank", rel: "noopener noreferrer" }, "Open application form") : null);
    const status = p.ready ? msg("good", "Packet ready. Fill the form, review it, and submit it yourself.") : el("div", { class: "msg warn" }, el("strong", {}, "Not ready yet"), el("ul", {}, p.blockers.map((b) => el("li", {}, b))));
    const integrity = p.job.integrity && p.job.integrity.level === "alarm" ? msg("bad", `This posting contains hidden or instruction-like text: ${p.job.integrity.verdict}. Don't paste it into an AI tool.`) : null;
    const fields = el("div", { class: "card" }, el("h2", { style: "margin-top:0" }, "Copy into the form"),
      p.fields.length ? p.fields.map((f) => el("div", { class: "field" }, el("div", { class: "lbl note" }, f.label, f.sensitive ? " (copy exactly)" : ""), el("div", { class: "val" }, f.value), el("button", { onclick: () => copy(f.value) }, "Copy")))
        : el("p", { class: "note" }, "Your answer bank is empty. ", el("a", { href: "#/answers" }, "Add answers"), " once and every packet uses them."),
      a && a.referral_name ? el("div", { class: "field" }, el("div", { class: "lbl note" }, "Referred by"), el("div", { class: "val" }, a.referral_name), el("button", { onclick: () => copy(a.referral_name) }, "Copy")) : null);

    const editor = answersEditor(a, p.answers, facts.items);
    const actions = a ? el("div", { class: "row" }, (NEXT[a.state] || []).filter((s) => ["approved", "submitted", "failed", "skipped"].includes(s)).map((s) =>
      el("button", { class: s === "submitted" ? "primary" : "", onclick: async () => {
        if (s === "submitted" && !confirm("Mark as submitted? Free-text answers are frozen after this.")) return;
        await guard(out, () => moveTo(a.id, s)); route(); } }, ACTION_LABEL[s] || STATE_LABEL[s]))) : el("p", { class: "note" }, "This job is not in your queue.");
    const gateNotes = a && a.gates ? a.gates.flatMap((g) => g.notes.map((n) => `${g.gate}: ${n}`)) : [];
    const gates = gateNotes.length ? el("details", { class: "card" }, el("summary", {}, "Gate notes"), el("ul", { class: "plain" }, gateNotes.map((n) => el("li", { class: "note" }, n)))) : null;
    out.replaceChildren(head, integrity, status, fields, editor, gates, el("h2", {}, "Status"), actions, el("p", { class: "note" }, "Resume files arrive in the beta; upload your own file to the form for now."));
  });
}

function answersEditor(app, existing, facts) {
  const box = el("div", { class: "card" });
  const rows = [];
  const verified = facts.filter((f) => f.verified);
  const out = el("div");
  function addRow(a = { label: "", kind: "short_answer", text: "", shortText: "", citedFactIds: [], maxChars: "" }) {
    const label = el("input", { value: a.label, placeholder: "Question, e.g. Why do you want to work here?" });
    const kind = el("select", {}, ["short_answer", "motivation", "self_intro", "project", "other"].map((k) => el("option", { value: k, selected: k === a.kind }, k.replace("_", " "))));
    const max = el("input", { type: "number", min: 1, value: a.maxChars || "", placeholder: "Character limit, if any" });
    const text = el("textarea", { value: a.text, placeholder: "Your answer. Use only what your verified facts support." });
    const short = el("textarea", { value: a.shortText || "", placeholder: "Short version (optional; needed when there is no limit or you are near it)" });
    const cites = el("div", { class: "row" }, verified.map((f) => el("label", { style: "display:flex;gap:6px;align-items:center;margin:0" },
      el("input", { type: "checkbox", value: f.id, checked: a.citedFactIds.includes(f.id) }), el("span", { class: "note" }, f.text.slice(0, 70)))));
    const result = el("div");
    const row = { get: () => ({ label: label.value.trim(), kind: kind.value, text: text.value, shortText: short.value.trim() || undefined,
      citedFactIds: [...cites.querySelectorAll("input:checked")].map((i) => i.value), maxChars: max.value ? Number(max.value) : undefined }), result };
    const node = el("div", { style: "border-top:1px solid var(--line);padding-top:10px;margin-top:10px" },
      el("div", { class: "grid" }, el("div", {}, el("label", {}, "Question"), label), el("div", {}, el("label", {}, "Kind"), kind), el("div", {}, el("label", {}, "Limit"), max)),
      el("label", { style: "margin-top:8px" }, "Answer"), text, el("label", {}, "Short version"), short,
      el("label", {}, "Facts this answer relies on"), verified.length ? cites : el("p", { class: "note" }, "Verify facts on your profile to cite them."),
      el("div", { class: "row" }, el("button", { class: "danger", onclick: () => { node.remove(); rows.splice(rows.indexOf(row), 1); } }, "Remove")), result);
    rows.push(row);
    list.append(node);
  }
  function showReview(items) {
    items.forEach((r, i) => {
      const parts = [`${r.full.words} words, ${r.full.chars} characters`];
      const problems = [...r.full.problems, ...(r.short ? r.short.problems.map((p) => `Short version: ${p}`) : []),
        ...(r.shortVariantMissing ? ["Add a short version."] : []),
        ...r.grounding.unsupportedFigures.map((f) => `"${f}" is not in any cited, verified fact.`),
        ...(r.grounding.badCitations.length ? ["A cited fact is not verified."] : [])];
      rows[i].result.replaceChildren(el("p", { class: `note` }, parts.join(" · ")), problems.length ? el("ul", {}, problems.map((p) => el("li", { class: "note" }, p))) : msg("good", "Passes the checks."));
    });
  }
  const list = el("div");
  const collect = () => rows.map((r) => r.get()).filter((a) => a.label && a.text.trim());
  const editable = app && ["queued", "approved", "ready_for_review", "failed"].includes(app.state);
  box.append(el("h2", { style: "margin-top:0" }, "Free-text answers"),
    el("p", { class: "note" }, "Draft them yourself or with any AI you use, then check them here: lengths are counted the way forms count them, and every number must come from a verified fact."),
    list,
    editable ? el("div", { class: "row", style: "margin-top:10px" },
      el("button", { onclick: () => addRow() }, "Add question"),
      el("button", { onclick: () => guard(out, async () => { const r = await api("POST", "/answers/review", collect()); out.replaceChildren(); showReview(r.items); }) }, "Check"),
      el("button", { class: "primary", onclick: () => guard(out, async () => { const r = await api("PUT", `/applications/${app.id}/answers`, collect()); out.replaceChildren(msg("good", "Saved.")); showReview(r.items); }) }, "Save")) :
      el("p", { class: "note" }, app ? "Answers are frozen after submission." : ""),
    out);
  for (const a of existing) addRow(a);
  if (existing.length) showReview(existing.map((a) => a.review));
  return box;
}

// ---------- tracker ----------
async function tracker() {
  const out = el("div");
  const filter = el("select", { onchange: () => load() }, el("option", { value: "" }, "All states"), Object.entries(STATE_LABEL).map(([k, v]) => el("option", { value: k }, v)));
  const body = el("tbody");
  async function load() {
    const r = await api("GET", `/applications${filter.value ? `?state=${filter.value}` : ""}`);

// ---------- connections ----------
async function connections() {
  const out = el("div");
  const conn = el("input", { type: "file", accept: ".csv,text/csv" }), msgs = el("input", { type: "file", accept: ".csv,text/csv" });
  const list = el("div");
  const read = (input) => (input.files && input.files[0] ? input.files[0].text() : Promise.resolve(null));
  const load = async () => {
    const r = await api("GET", "/connections");
    const by = new Map();
    for (const c of r.items) { if (!by.has(c.company)) by.set(c.company, []); by.get(c.company).push(c); }
    const person = (p) => el("li", {}, p.full_name, " ", el("span", { class: "note" },
      [p.position, p.messages_count ? `${p.messages_count} messages` : null, p.last_ask_at ? `asked ${p.last_ask_at}` : null].filter(Boolean).join(" · ")));
    const group = ([co, people]) => el("details", { class: "card" }, el("summary", {}, `${co} · ${people.length}`), el("ul", { class: "plain" }, people.map(person)));
    list.replaceChildren(...(by.size ? [...by].map(group) : [el("p", { class: "note" }, "No contacts matched to catalog companies yet.")]));
  };
  render(el("h1", {}, "Connections"),
    el("p", { class: "sub" }, "Upload your own LinkedIn export. Nothing is scraped and your LinkedIn login is never used."),
    el("div", { class: "card" },
      el("ol", { class: "note" }, el("li", {}, "On LinkedIn: Me > Settings & Privacy > Data privacy > Get a copy of your data."),
        el("li", {}, "Choose Connections and Messages, request the archive, and download it when LinkedIn emails you."),
        el("li", {}, "Unzip it and pick the two files below. Re-upload every week or two; earlier asks are kept.")),
      el("div", { class: "grid" }, el("div", {}, el("label", {}, "Connections.csv (required)"), conn), el("div", {}, el("label", {}, "messages.csv (optional, ranks warm contacts first)"), msgs)),
      el("div", { class: "row", style: "margin-top:10px" }, el("button", { class: "primary", onclick: () => guard(out, async () => {
        const connectionsCsv = await read(conn);
        if (!connectionsCsv) throw new Error("Pick Connections.csv first.");
        const r = await api("POST", "/connections/import", { connectionsCsv, messagesCsv: await read(msgs) });
        out.replaceChildren(msg("good", `Imported ${r.imported} people. ${r.matched} work at ${r.companies} companies in your catalog.`), ...r.warnings.map((w) => msg("warn", w)));
        await load(); }) }, "Import")), out),
    el("h2", {}, "People at companies you track"), list);
  await guard(out, load);
}
