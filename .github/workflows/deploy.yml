name: Deploy

# Every push to main: test, migrate the database, deploy the Worker, then smoke-test it.
# A failed step stops everything after it, so a broken build never reaches the database or users.
#
# Four repository secrets (Settings > Secrets and variables > Actions), nothing else:
#   CLOUDFLARE_API_TOKEN   token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account id
#   DATABASE_OWNER_URL     Neon owner connection string (EU region)
#   MCA_TOKEN               your API token: `openssl rand -base64 32`
# The app's own database logins and their connection strings are derived from DATABASE_OWNER_URL
# (scripts/db-urls.mjs) and created by the migrate job.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  preflight:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
          MCA_TOKEN: ${{ secrets.MCA_TOKEN }}
        run: |
          missing=0
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_OWNER_URL MCA_TOKEN; do
            if [ -z "${!n}" ]; then echo "::error::Secret $n is not set (see DEPLOY.md)"; missing=1; fi
          done
          MCA_TOKEN="$(printf %s "$MCA_TOKEN" | tr -d '[:space:]')"
          if [ ${#MCA_TOKEN} -lt 24 ]; then echo "::error::MCA_TOKEN must be at least 24 characters"; missing=1; fi
          exit $missing

  migrate:
    needs: preflight
    runs-on: ubuntu-latest
    env:
      DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: node scripts/db-urls.mjs
      - run: scripts/migrate.sh
      - name: App login roles
        run: |
          OWNER="$(printf %s "$DATABASE_OWNER_URL" | tr -d '[:space:]')"
          psql "$OWNER" -q -v api_password="$MCA_API_DB_PASSWORD" \
            -v loader_password="$MCA_LOADER_DB_PASSWORD" -f scripts/bootstrap_roles.sql

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.wrangler.outputs.deployment-url }}
    env:
      DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      # Stamp the page's own files with this commit so browsers fetch the new ones after a deploy.
      - name: Version the web files
        run: |
          v="${GITHUB_SHA::7}"
          sed -i -E "s#(href|src)=\"/(app\.css|app\.js|resume-step\.js|theme\.js)\"#\1=\"/\2?v=$v\"#g" apps/api/public/index.html
          grep -c "?v=$v" apps/api/public/index.html
      - run: node scripts/db-urls.mjs
      - id: wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy
          secrets: |
            DATABASE_URL
            INGEST_DATABASE_URL
            API_TOKENS
            AI_KEY_SECRET
        env:
          API_TOKENS: founder:${{ secrets.MCA_TOKEN }}
      # Optional: lets "Build today's queue" start the GitHub job (see DEPLOY.md). Skipped until set.
      - name: On-demand fetch token
        if: env.GH_DISPATCH_TOKEN != ''
        working-directory: apps/api
        run: printf '%s' "$GH_DISPATCH_TOKEN" | npx wrangler secret put GITHUB_DISPATCH_TOKEN
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run smoke
        env:
          MCA_URL: ${{ vars.MCA_URL || needs.deploy.outputs.url }}
          MCA_TOKEN: ${{ secrets.MCA_TOKEN }}
      - name: Where it lives
        run: echo "Deployed to ${{ vars.MCA_URL || needs.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
