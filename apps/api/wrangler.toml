name = "my-career-agent-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# The app's home. The workers.dev address keeps working too, so old links and bookmarks still open.
workers_dev = true
routes = [{ pattern = "app.mycareeragent.dev", custom_domain = true }]

# Static web app (onboarding, queue, copy-assist panel). Requests to static assets are free.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# No scheduled triggers: job fetching (every 3 hours) and the daily queue (06:05 UTC) run on GitHub
# Actions in .github/workflows/jobs.yml, because the Workers free plan allows 10 ms of CPU per request.
[triggers]
crons = []

[vars]
DEV_MODE = "false"
INGEST_BOARDS_PER_RUN = "40"
APP_URL = "https://app.mycareeragent.dev"          # links in emails the app sends
MAIL_FROM = "noreply@mycareeragent.dev"           # sender of account email; needs RESEND_API_KEY or the EMAIL binding
GITHUB_REPO = "ayushjainid/my-career-agent"     # holds jobs.yml, started by "Build today's queue"
INBOUND_DOMAIN = "in.mycareeragent.dev"   # Email Routing catch-all on this subdomain sends to this Worker
INVITE_REQUIRED = "true"                        # beta: sign-up needs an invite code
ADMIN_USER_IDS = "founder"                      # may create invite codes (POST /api/admin/invites)
PBKDF2_ITERATIONS = "50000"                     # ~7 ms CPU per sign-in, inside the Free plan's 10 ms; raise to 100000 on Workers Paid

# Resumes and exports. Create with: wrangler r2 bucket create my-career-agent-files --jurisdiction eu
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "my-career-agent-files"
# jurisdiction = "eu"

# Secrets (set with `wrangler secret put`):
#   DATABASE_URL         Neon connection string for the mca_app login role
#   INGEST_DATABASE_URL  Neon connection string for the mca_ingest login role
#   API_TOKENS           founder:<MCA_TOKEN>, the POC token sign-in
#   AI_KEY_SECRET        encrypts people's own AI keys (derived by scripts/db-urls.mjs)
