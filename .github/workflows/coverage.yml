name: Coverage KPI
# Coverage KPI per country against the government sponsor lists, and the biggest uncovered employers.
# Public catalog data only, no user data. Each run stores a snapshot in mca.coverage_snapshot.
on:
  workflow_dispatch:
    inputs:
      gaps: { description: 'Biggest uncovered employers to list per country', default: '60' }
      match: { description: 'Optional: comma-separated regexes of sponsor names to list (for aliases)', default: '' }
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx esbuild scripts/jobs-runner.mts --bundle --platform=node --format=esm --target=node22 --outfile=dist/jobs-runner.mjs --log-level=warning
      - name: Derive the connection strings
        run: node scripts/db-urls.mjs
        env:
          DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
      - run: node dist/jobs-runner.mjs coverage --gaps ${{ inputs.gaps || 60 }}
      - if: ${{ inputs.match != '' }}
        run: node dist/jobs-runner.mjs sponsors --match "$MATCH"
        env: { MATCH: "${{ inputs.match }}" }
